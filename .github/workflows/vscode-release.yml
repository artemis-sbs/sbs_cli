name: Release VS Code extension

# Fires on tags like `amd-vscode-v0.1.0`. Builds the AMD extension .vsix from
# editors/vscode (version taken from the tag) and attaches it to a GitHub
# release. To cut a release:  git tag amd-vscode-v0.2.0 && git push origin amd-vscode-v0.2.0
on:
  push:
    tags:
      - "amd-vscode-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 18: vsce's own dependencies (undici) now need the global `File` that
      # Node 18 lacks, so packaging died on it (amd-vscode-v0.8.1).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm install`, not `npm ci`: package-lock.json is gitignored in editors/vscode,
      # and `npm ci` refuses to run without one (that is what failed amd-vscode-v0.8.0).
      - name: Install
        working-directory: editors/vscode
        run: npm install --no-audit --no-fund

      - name: Set version from tag
        working-directory: editors/vscode
        run: |
          VERSION="${GITHUB_REF_NAME#amd-vscode-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package
        working-directory: editors/vscode
        run: npm run package

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "editors/vscode/*.vsix"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: false   # never become the repo's "latest" release — `sbs update` reads that for sbs.pyz
          # ...and makeLatest alone did NOT stop it: amd-vscode-v0.8.2 became "latest" anyway
          # and `sbs update` lost sbs.bat until 0.7 was re-marked. GitHub never makes a
          # PRERELEASE the latest release, so this is the setting that actually holds.
          prerelease: true
          name: "Artemis AMD (VS Code) ${{ github.ref_name }}"
          generateReleaseNotes: true
          body: |
            Language support for Artemis Cosmos **AMD** (`.amd`) mission content in VS Code.

            **Install:** download the `.vsix` below, then in VS Code run **Extensions: Install from VSIX…** (or `code --install-extension <file>.vsix`). It auto-detects your Cosmos install; set `amd.cosmosPath` if needed.
