name: Release VS Code extension

# Fires on tags like `amd-vscode-v0.1.0`. Builds the AMD extension .vsix from
# editors/vscode (version taken from the tag) and attaches it to a GitHub
# release. To cut a release:  git tag amd-vscode-v0.2.0 && git push origin amd-vscode-v0.2.0
on:
  push:
    tags:
      - "amd-vscode-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install
        working-directory: editors/vscode
        run: npm ci

      - name: Set version from tag
        working-directory: editors/vscode
        run: |
          VERSION="${GITHUB_REF_NAME#amd-vscode-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package
        working-directory: editors/vscode
        run: npm run package

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "editors/vscode/*.vsix"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          name: "Artemis AMD (VS Code) ${{ github.ref_name }}"
          generateReleaseNotes: true
          body: |
            Language support for Artemis Cosmos **AMD** (`.amd`) mission content in VS Code.

            **Install:** download the `.vsix` below, then in VS Code run **Extensions: Install from VSIX…** (or `code --install-extension <file>.vsix`). It auto-detects your Cosmos install; set `amd.cosmosPath` if needed.
